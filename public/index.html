<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask Kyle</title>
<meta name="description" content="An AI that reflects how Kyle Ramos thinks — about business, coaching, Organization Development, and transformation." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e0d0b;
    --surface: #17150f;
    --surface-2: #1f1c15;
    --line: #2d2920;
    --text: #efe9dc;
    --muted: #a39b88;
    --gold: #d9b45a;
    --gold-soft: rgba(217,180,90,.12);
    --user: #2a2518;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f4ec; --surface: #ffffff; --surface-2: #f1ece0; --line: #e2dccd;
      --text: #1d1a14; --muted: #6d6656; --gold: #9a7420; --gold-soft: rgba(154,116,32,.10); --user: #efe6d0;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 Inter, system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 18px 16px 14px;
  }
  .wrap { max-width: 760px; margin: 0 auto; width: 100%; }
  .brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px;
    margin: 0; letter-spacing: -.01em;
  }
  h1 span { color: var(--gold); }
  .tag { color: var(--muted); font-size: 13.5px; }

  .modes { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .modes::-webkit-scrollbar { display: none; }
  .mode {
    flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 7px 14px; border-radius: 999px; font: 500 13px Inter, sans-serif; cursor: pointer;
    transition: all .15s;
  }
  .mode:hover { color: var(--text); border-color: var(--muted); }
  .mode[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }

  main { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .empty { text-align: left; padding: 8px 0; }
  .empty p { color: var(--muted); margin: 0 0 18px; max-width: 560px; }
  .starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .starter {
    text-align: left; background: var(--surface); border: 1px solid var(--line); color: var(--text);
    padding: 14px; border-radius: var(--radius); cursor: pointer; font: 14px/1.45 Inter, sans-serif;
    transition: border-color .15s, transform .15s;
  }
  .starter:hover { border-color: var(--gold); transform: translateY(-1px); }
  .starter small { display: block; color: var(--gold); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }

  .msg { margin: 0 0 20px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 12px 16px; border-radius: var(--radius); white-space: pre-wrap; word-wrap: break-word; }
  .user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .kyle .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .kyle .who { font: 600 11px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .bubble strong { color: var(--text); }
  .err .bubble { border-color: #8a3b2e; color: #e8a090; }
  .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: var(--muted); animation: b 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s } .dots span:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }

  footer { border-top: 1px solid var(--line); padding: 12px 16px 16px; background: var(--bg); }
  form { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 180px; min-height: 48px;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px; font: 15px/1.5 Inter, sans-serif; outline: none;
  }
  textarea:focus { border-color: var(--gold); }
  button.send {
    height: 48px; padding: 0 20px; border: 0; border-radius: var(--radius);
    background: var(--gold); color: #17150f; font: 600 14px Inter, sans-serif; cursor: pointer;
  }
  button.send:disabled { opacity: .45; cursor: default; }
  .fine { color: var(--muted); font-size: 12px; margin-top: 8px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .fine button { background: none; border: 0; color: var(--muted); font: 12px Inter, sans-serif; cursor: pointer; text-decoration: underline; padding: 0; }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <h1>Ask <span>Kyle</span></h1>
        <div class="tag">How I think about business, coaching, and transformation.</div>
      </div>
      <div class="modes" role="group" aria-label="Mode">
        <button class="mode" data-mode="think" aria-pressed="true">How I think</button>
        <button class="mode" data-mode="scenario" aria-pressed="false">Scenarios</button>
        <button class="mode" data-mode="business" aria-pressed="false">Business problem</button>
        <button class="mode" data-mode="coaching" aria-pressed="false">Coaching &amp; Organization Development</button>
        <button class="mode" data-mode="captions" aria-pressed="false">Captions &amp; scripts</button>
      </div>
    </div>
  </header>

  <main id="chat">
    <div class="wrap" id="log">
      <div class="empty" id="empty">
        <p>Bring me a situation, a decision, or a problem. I'll show you how I'd look at it — identity first, vital few over everything else.</p>
        <div class="starters">
          <button class="starter" data-mode="business" data-q="Our team keeps missing KPIs even after we added more reports and check-ins. What would you do?"><small>Business</small>Our team keeps missing KPIs even after more reports and check-ins.</button>
          <button class="starter" data-mode="scenario" data-q="How would you react if a junior colleague gave you blunt feedback in front of the team?"><small>Scenario</small>A junior colleague gives you blunt feedback in front of the team.</button>
          <button class="starter" data-mode="coaching" data-q="A leader says they want an empowered team but still approves every small decision. How do you coach them?"><small>Coaching</small>A leader wants an empowered team but approves every small decision.</button>
          <button class="starter" data-mode="captions" data-q="Write 5 short Taglish captions about discipline and showing up even when you don't feel like it."><small>Captions</small>Taglish captions about discipline and showing up.</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <form id="form">
        <textarea id="input" rows="1" placeholder="Ask Kyle anything..." maxlength="4000"></textarea>
        <button class="send" id="send" type="submit">Ask</button>
      </form>
      <div class="fine">
        <span>An AI reflection of Kyle's thinking, not Kyle himself. For real engagements, reach out directly.</span>
        <button type="button" id="reset">New conversation</button>
      </div>
    </div>
  </footer>

<script>
  const log = document.getElementById("log");
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const empty = document.getElementById("empty");
  let mode = "think";
  let messages = [];
  let busy = false;

  const setMode = (m) => {
    mode = m;
    document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  };
  document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  document.querySelectorAll(".starter").forEach(b => b.addEventListener("click", () => {
    setMode(b.dataset.mode); ask(b.dataset.q);
  }));

  // Minimal, safe markdown: escape first, then bold/italics.
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const md = s => esc(s)
    .replace(/^#{1,4}\s*(.+)$/gm, "<strong>$1</strong>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>");

  function add(role, text, cls = "") {
    empty && empty.remove();
    const row = document.createElement("div");
    row.className = `msg ${role} ${cls}`;
    const b = document.createElement("div");
    b.className = "bubble";
    if (role === "kyle") b.innerHTML = `<div class="who">Kyle</div>` + text;
    else b.textContent = text;
    row.appendChild(b);
    log.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  async function ask(q) {
    q = (q || "").trim();
    if (!q || busy) return;
    busy = true; send.disabled = true;
    add("user", q);
    messages.push({ role: "user", content: q });
    input.value = ""; autosize();
    const pending = add("kyle", `<span class="dots"><span></span><span></span><span></span></span>`);
    try {
      const r = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode, messages })
      });
      const data = await r.json().catch(() => ({}));
      pending.remove();
      if (!r.ok || !data.reply) {
        const err = new Error(data.error || `No response (HTTP ${r.status}).`);
        err.detail = data.detail;
        throw err;
      }
      messages.push({ role: "assistant", content: data.reply });
      add("kyle", md(data.reply));
    } catch (e) {
      pending.remove();
      messages.pop();
      add("kyle", esc(e.message || "Something went wrong.") +
        (e.detail ? `<div style="font-size:12px;opacity:.7;margin-top:6px">${esc(e.detail)}</div>` : ""), "err");
    } finally {
      busy = false; send.disabled = false; input.focus();
    }
  }

  form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
  const autosize = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; };
  input.addEventListener("input", autosize);
  document.getElementById("reset").addEventListener("click", () => location.reload());
</script>
</body>
</html>
